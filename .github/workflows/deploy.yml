name: Deploy & Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # 仅当推送版本 tag（如 v1.0.0）时运行：构建单页 HTML 并创建/发布 Release，不触发 Pages 部署
  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build offline single-page HTML
        run: |
          pnpm build:single
          cp dist-single/index.html akf.html

      - name: Publish Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" akf.html --clobber
          else
            gh release create "${{ github.ref_name }}" akf.html \
              --title "${{ github.ref_name }}" \
              --generate-notes
          fi

  # 仅当推送到主分支（master/main）或手动触发时运行：构建 Pages 静态资源
  build-pages:
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site for GitHub Pages
        run: pnpm build

      - name: Build offline single-page HTML
        run: |
          pnpm build:single
          cp dist-single/index.html akf.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Upload akf.html artifact
        uses: actions/upload-artifact@v4
        with:
          name: akf.html
          path: akf.html
          if-no-files-found: error

  # 部署到 GitHub Pages
  deploy-pages:
    if: "!startsWith(github.ref, 'refs/tags/')"
    needs: build-pages
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
